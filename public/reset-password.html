<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сброс пароля</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Сброс пароля</h1>

      <form id="forgot-form">
        <label>
          Email
          <input type="email" id="forgot-email" required>
        </label>
        <button type="submit">Отправить ссылку</button>
        <p id="forgot-error" class="error hidden"></p>
        <p id="forgot-success" class="success hidden"></p>
      </form>

      <form id="reset-form" class="hidden">
        <label>
          Email
          <input type="email" id="reset-email" readonly>
        </label>
        <label>
          Новый пароль
          <input type="password" id="reset-password" minlength="6" required>
        </label>
        <button type="submit">Сохранить пароль</button>
        <p id="reset-error" class="error hidden"></p>
        <p id="reset-success" class="success hidden"></p>
      </form>
    </section>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
