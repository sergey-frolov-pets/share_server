<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аккаунт</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section id="login-card" class="card hidden">
      <h1>Вход</h1>
      <form id="user-login-form">
        <label>
          Email
          <input type="email" id="login-email" required>
        </label>
        <label>
          Пароль
          <input type="password" id="login-password" required>
        </label>
        <button type="submit">Войти</button>
        <p id="login-error" class="error hidden"></p>
      </form>
      <p class="hint"><a href="/reset-password.html">Забыли пароль?</a></p>
    </section>

    <section id="account-card" class="card hidden">
      <header class="header">
        <h1>Аккаунт</h1>
        <button type="button" id="logout-btn" class="link-btn">Выйти</button>
      </header>
      <p id="account-email" class="hint"></p>

      <form id="change-password-form">
        <label>
          Текущий пароль
          <input type="password" id="current-password" required>
        </label>
        <label>
          Новый пароль
          <input type="password" id="new-password" minlength="6" required>
        </label>
        <button type="submit">Изменить пароль</button>
        <p id="change-error" class="error hidden"></p>
        <p id="change-success" class="success hidden"></p>
      </form>

      <div id="upload-access" class="result hidden">
        <p class="hint" id="upload-access-info"></p>
        <a href="/user-upload.html" class="primary-btn" style="display:block;text-align:center;text-decoration:none;margin-top:8px">Мои файлы</a>
      </div>
    </section>
  </main>
  <script src="/account.js"></script>
</body>
</html>
